<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Galeri - KUA Panca Lautang</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f7f6;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .back {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.15);
      padding: 9px 14px;
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .upload {
      background: #0f766e;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
      width: 100%;
      margin-top: 8px;
    }

    #status {
      margin-top: 12px;
      font-weight: bold;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .photo {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .photo img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .photo-info {
      padding: 12px;
    }

    .photo-title {
      font-weight: bold;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🖼️ Admin Galeri</h1>
  <a class="back" href="./index.html">← Kembali</a>
</header>

<main>

  <div class="card">
    <h2>Tambah Foto Galeri</h2>

    <label>Judul Foto</label>
    <input
      type="text"
      id="title"
      placeholder="Contoh: Kegiatan Penyuluh KUA Panca Lautang"
    >

    <label>Pilih Foto</label>
    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <button class="upload" id="uploadBtn">
      ⬆️ Upload Foto
    </button>

    <div id="status"></div>
  </div>

  <div class="card">
    <h2>Foto Galeri</h2>
    <div id="gallery" class="gallery">
      <div class="empty">Memuat galeri...</div>
    </div>
  </div>

</main>

<script>
  const supabase = window.supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.anonKey
  );

  const BUCKET = "media";

  async function checkLogin() {
    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
      window.location.href = "./login.html";
      return false;
    }

    return true;
  }

  async function loadGallery() {
    const gallery = document.getElementById("gallery");

    gallery.innerHTML = '<div class="empty">Memuat galeri...</div>';

    const { data, error } = await supabase
      .from("content_items")
      .select("*")
      .eq("type", "galeri")
      .order("created_at", { ascending: false });

    if (error) {
      gallery.innerHTML =
        '<div class="empty">Gagal memuat galeri: ' +
        escapeHtml(error.message) +
        '</div>';
      return;
    }

    if (!data || data.length === 0) {
      gallery.innerHTML =
        '<div class="empty">Belum ada foto galeri.</div>';
      return;
    }

    gallery.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "photo";

      div.innerHTML = `
        <img
          src="${escapeAttribute(item.image_url || "")}"
          alt="${escapeAttribute(item.title || "Foto galeri")}"
        >

        <div class="photo-info">
          <div class="photo-title">
            ${escapeHtml(item.title || "Tanpa judul")}
          </div>

          <button
            class="delete"
            onclick="deletePhoto('${item.id}', '${escapeAttribute(item.file_path || "")}')"
          >
            🗑️ Hapus Foto
          </button>
        </div>
      `;

      gallery.appendChild(div);
    });
  }

  async function uploadPhoto() {
    const titleInput = document.getElementById("title");
    const photoInput = document.getElementById("photo");
    const status = document.getElementById("status");
    const uploadBtn = document.getElementById("uploadBtn");

    const title = titleInput.value.trim();
    const file = photoInput.files[0];

    if (!title) {
      status.textContent = "⚠️ Isi judul foto terlebih dahulu.";
      return;
    }

    if (!file) {
      status.textContent = "⚠️ Pilih foto terlebih dahulu.";
      return;
    }

    uploadBtn.disabled = true;
    status.textContent = "⏳ Sedang upload...";

    try {
      const sessionResult = await supabase.auth.getSession();

      if (!sessionResult.data.session) {
        window.location.href = "./login.html";
        return;
      }

      const safeName = file.name
        .replace(/[^a-zA-Z0-9._-]/g, "-")
        .toLowerCase();

      const filePath =
        "gallery/" +
        crypto.randomUUID() +
        "-" +
        safeName;

      const uploadResult = await supabase.storage
        .from(BUCKET)
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false
        });

      if (uploadResult.error) {
        throw new Error(
          "Upload Storage gagal: " +
          uploadResult.error.message
        );
      }

      const publicResult = supabase.storage
        .from(BUCKET)
        .getPublicUrl(filePath);

      const imageUrl = publicResult.data.publicUrl;

      const insertResult = await supabase
        .from("content_items")
        .insert({
          type: "galeri",
          title: title,
          image_url: imageUrl,
          file_path: filePath,
          file_name: file.name,
          file_type: file.type,
          file_size: file.size,
          published: true
        });

      if (insertResult.error) {

        // Jika database gagal, coba hapus file
        // agar tidak meninggalkan file yatim di Storage.
        await supabase.storage
          .from(BUCKET)
          .remove([filePath]);

        throw new Error(
          "Data galeri gagal disimpan: " +
          insertResult.error.message
        );
      }

      status.textContent = "✅ Foto berhasil diupload.";

      titleInput.value = "";
      photoInput.value = "";

      await loadGallery();

    } catch (error) {
      console.error(error);
      status.textContent = "❌ " + error.message;
    }

    uploadBtn.disabled = false;
  }

  async function deletePhoto(id, filePath) {
    if (!confirm("Yakin ingin menghapus foto ini?")) {
      return;
    }

    try {
      const status = document.getElementById("status");
      status.textContent = "⏳ Menghapus foto...";

      // 1. Hapus file sebenarnya dari Storage
      if (filePath) {
        const storageResult = await supabase.storage
          .from(BUCKET)
          .remove([filePath]);

        if (storageResult.error) {
          throw new Error(
            "File Storage gagal dihapus: " +
            storageResult.error.message
          );
        }
      }

      // 2. Hapus data galeri dari database
      const dbResult = await supabase
        .from("content_items")
        .delete()
        .eq("id", id);

      if (dbResult.error) {
        throw new Error(
          "Data galeri gagal dihapus: " +
          dbResult.error.message
        );
      }

      status.textContent = "✅ Foto benar-benar sudah dihapus.";

      await loadGallery();

    } catch (error) {
      console.error(error);
      document.getElementById("status").textContent =
        "❌ " + error.message;
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttribute(value) {
    return escapeHtml(value);
  }

  document
    .getElementById("uploadBtn")
    .addEventListener("click", uploadPhoto);

  (async function() {
    const loggedIn = await checkLogin();

    if (loggedIn) {
      await loadGallery();
    }
  })();
</script>

</body>
</html>
